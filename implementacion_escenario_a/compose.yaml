name: petroandes-educativo
services:
  project: &project
    image: petroandes-educativo:local
    build:
      context: ..
      dockerfile: implementacion_escenario_a/Dockerfile
    working_dir: /workspace/implementacion_escenario_a
    environment: &project-environment
      PETROANDES_CACHE_DIR: /workspace/petroandes-data/cache
      PETROANDES_MODELS_DIR: /workspace/petroandes-data/cache/models
      PETROANDES_ARTIFACTS_DIR: /workspace/petroandes-data/artifacts
      PETROANDES_INSPECTOR_DIR: /opt/inspector
    volumes:
      - model-cache:/workspace/petroandes-data/cache
      - artifacts:/workspace/petroandes-data/artifacts
      - ./reports/portable:/workspace/implementacion_escenario_a/reports/portable
    command: ["tools/preflight.py"]
  dev:
    <<: *project
    profiles: ["dev"]
    volumes: &source-volumes
      - .:/workspace/implementacion_escenario_a:ro
      - model-cache:/workspace/petroandes-data/cache
      - artifacts:/workspace/petroandes-data/artifacts
      - ./reports/portable:/workspace/implementacion_escenario_a/reports/portable
  debug:
    <<: *project
    profiles: ["debug"]
    ports:
      - "127.0.0.1:5678:5678"
    volumes: *source-volumes
    command: ["-m", "debugpy", "--listen", "0.0.0.0:5678", "--wait-for-client", "tools/preflight.py"]
  f9-sandbox:
    <<: *project
    profiles: ["dev"]
    user: "10001:10001"
    read_only: true
    network_mode: none
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 2g
    cpus: 2
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1073741824,mode=1777
    environment:
      <<: *project-environment
      PETROANDES_CACHE_DIR: /tmp/cache
      PETROANDES_MODELS_DIR: /models-root/models
      PETROANDES_ARTIFACTS_DIR: /tmp/artifacts
      PYTHONDONTWRITEBYTECODE: "1"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      HOME: /tmp
      PETROANDES_F9_OUTPUT_DIR: /f9-output
      PETROANDES_AUDIT_DIR: /f9-output/mcp-audit
    volumes:
      - .:/workspace/implementacion_escenario_a:ro
      - model-cache:/models-root:ro
      - ${PETROANDES_F9_OUTPUT_HOST:-./reports/portable/f9-isolated-output}:/f9-output
    command: ["tools/f9_guard_check.py", "--help"]
  inspector-web:
    <<: *project
    profiles: ["inspector"]
    init: true
    hostname: inspector-web
    command: ["tools/f7_inspector_web.py"]
    environment:
      <<: *project-environment
      HOST: inspector-web
      CLIENT_PORT: "6274"
      ALLOWED_ORIGINS: "http://127.0.0.1:6274,http://localhost:6274"
      MCP_AUTO_OPEN_ENABLED: "false"
      MCP_INSPECTOR_SECRET_STORE: memory
    ports:
      - "127.0.0.1:6274:6274"
    networks: [inspector-web]
    volumes: *source-volumes
volumes:
  model-cache:
  artifacts:
networks:
  inspector-web:
